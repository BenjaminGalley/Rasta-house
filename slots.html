<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Zion Slots | Rasta House</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050706;color:#fff;font-family:Arial,sans-serif}body{min-height:100dvh;background:radial-gradient(ellipse at 50% 8%,#253528,#090d0a 55%,#020302);padding-bottom:18px}.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #c9a64d;background:#030504}.top a{color:#f3d98d;text-decoration:none;font-weight:800}.brand{font-weight:900;letter-spacing:2px;color:#ffdf83}.wrap{width:min(96vw,520px);margin:auto;padding:12px 8px 22px}.title{text-align:center;font-weight:900;letter-spacing:2px;color:#ffe7a0;font-size:clamp(22px,6vw,32px);margin:10px 0 5px}.sub{text-align:center;color:#aeb9a9;font-size:11px;letter-spacing:2px;margin-bottom:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.stat{background:#0d1710;border:1px solid #c9a64d88;border-radius:10px;padding:9px;text-align:center}.stat small{display:block;color:#aeb9a9;font-size:10px;letter-spacing:1px}.stat b{display:block;color:#ffe7a0;font-size:18px;margin-top:4px}.machine{padding:10px;border:4px solid #bd9147;border-radius:18px;background:linear-gradient(145deg,#18241b,#050806 60%);box-shadow:0 12px 30px #000,inset 0 0 22px #000}.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#020302;padding:7px;border:2px solid #6f552c;border-radius:10px}.reel{display:grid;grid-template-rows:repeat(3,1fr);gap:5px;min-width:0}.cell{height:clamp(82px,24vw,118px);display:grid;place-items:center;background:linear-gradient(145deg,#f6edce,#c6b98f 55%,#8c7a50);border:1px solid #fff0c0;border-radius:8px;overflow:hidden}.cell img{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 4px 5px #392b13)}.cell.win{background:linear-gradient(145deg,#fff4b5,#f2b735);box-shadow:0 0 18px #ffd65c;animation:pulse .5s infinite alternate}@keyframes pulse{to{filter:brightness(1.2);transform:scale(.97)}}.machine.spinning .cell img{animation:blur .12s infinite alternate}@keyframes blur{to{filter:blur(2px);transform:translateY(5px)}}.status{height:30px;text-align:center;color:#ffe08a;font-size:13px;font-weight:900;letter-spacing:1px;margin:10px 0}.controls{position:sticky;bottom:8px;z-index:5;background:#070b08f5;border:1px solid #c9a64d88;border-radius:14px;padding:11px;box-shadow:0 -5px 24px #000}.betrow{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}.betrow button{width:48px;height:44px;border-radius:10px;border:1px solid #f3d98d;background:linear-gradient(#72552b,#291d0c);color:#fff0bd;font-size:25px;font-weight:900}.betvalue{min-width:88px;text-align:center;color:#ffe7a0;font-size:21px;font-weight:900}.spin{width:100%;min-height:58px;border:2px solid #fff0b2;border-radius:12px;background:linear-gradient(#ffdf86,#d58a23 60%,#75400e);color:#251605;font-weight:1000;font-size:20px;letter-spacing:2px;box-shadow:0 4px 0 #60370e}.spin:disabled{opacity:.55}.note{text-align:center;color:#879184;font-size:10px;margin-top:10px}@media(max-height:680px){.cell{height:clamp(66px,19vw,90px)}.wrap{padding-top:6px}.title{margin-top:4px}.controls{padding:8px}.spin{min-height:50px}}
#machine{position:relative}#paylines{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);z-index:6;pointer-events:none}#paylines polyline{fill:none;stroke:#ffea62;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px #000) drop-shadow(0 0 9px #ffd84a);stroke-dasharray:1200;stroke-dashoffset:1200;animation:zionLine .6s ease forwards}@keyframes zionLine{to{stroke-dashoffset:0}}#slotWinBanner{position:absolute;top:8px;left:50%;transform:translate(-50%,-10px);z-index:9;padding:8px 15px;border:2px solid #fff0a4;border-radius:28px;background:linear-gradient(#fff1a5,#d99a2c 60%,#75410c);color:#261704;font-weight:1000;white-space:nowrap;box-shadow:0 5px 18px #000b;opacity:0;pointer-events:none}#slotWinBanner.show{opacity:1;transform:translate(-50%,0);transition:.25s}.reel{display:block;overflow:hidden;height:calc(3 * clamp(82px,24vw,118px) + 10px)}.reel-track{display:grid;gap:5px;will-change:transform}.machine.spinning .cell img{animation:none}</style></head><body><header class="top"><a href="index.html">← LOBBY</a><div class="brand">RASTA HOUSE</div><span style="color:#d8c58e;font-size:11px">ZION</span></header><main class="wrap"><h1 class="title">ZION SLOTS</h1><div class="sub">THREE REELS · FIVE PAYLINES</div><div class="stats"><div class="stat"><small>DEMO CREDITS</small><b id="balance">1,000</b></div><div class="stat"><small>LAST WIN</small><b id="lastWin">0</b></div></div><section class="machine" id="machine"><div class="reels" id="reels"></div><svg id="paylines" aria-hidden="true"></svg><div id="slotWinBanner"></div></section><div class="status" id="status">READY TO SPIN</div><section class="controls"><div class="betrow"><button id="minus">−</button><div class="betvalue">BET <span id="bet">10</span></div><button id="plus">+</button></div><button class="spin" id="spin">SPIN</button></section><div class="note">Demo credits only · No cash wagering or cash prizes</div></main>
<script src="asset/games/wallet.js"></script><script>
(()=>{const assets=['asset/cherry.g.png','asset/lemon.g.png','asset/orange.g.png','asset/plum.g.png','asset/seven.g.png','asset/wild.g.png'],names=['Cherry','Lemon','Orange','Plum','Seven','Wild'],pays=[3,4,5,6,12,20],lines=[[1,1,1],[0,0,0],[2,2,2],[0,1,2],[2,1,0]];let credits=Number(localStorage.getItem('rasta_demo_credits'));if(!Number.isFinite(credits)||credits<0)credits=1000;let bet=10,busy=false,last=0,walletReady=false;const $=id=>document.getElementById(id),machine=$('machine'),reels=$('reels');
function save(){localStorage.setItem('rasta_demo_credits',String(credits));$('balance').textContent=Math.floor(credits).toLocaleString();$('bet').textContent=bet;$('lastWin').textContent=last.toLocaleString();$('spin').disabled=busy||credits<bet;$('minus').disabled=busy||bet<=2;$('plus').disabled=busy||bet>=1500}
function cell(id,c,r){const d=document.createElement('div');d.className='cell';if(c!==undefined){d.dataset.c=c;d.dataset.r=r}const img=document.createElement('img');img.src=assets[id];img.alt=names[id];d.appendChild(img);return d}
function draw(g){reels.innerHTML='';for(let c=0;c<3;c++){const col=document.createElement('div');col.className='reel';for(let r=0;r<3;r++)col.appendChild(cell(g[c][r],c,r));reels.appendChild(col)}}
function rand(){return Math.floor(Math.random()*assets.length)}
async function slide(g){reels.innerHTML='';const tracks=[];for(let c=0;c<3;c++){const col=document.createElement('div'),track=document.createElement('div');col.className='reel';track.className='reel-track';for(let r=0;r<3;r++)track.appendChild(cell(g[c][r],c,r));for(let n=0;n<22;n++)track.appendChild(cell(rand()));col.appendChild(track);reels.appendChild(col);tracks.push({col,track,c})}const h=tracks[0].track.children[0].getBoundingClientRect().height,step=h+5;tracks.forEach(x=>{x.col.style.height=(3*h+10)+'px';x.track.style.transform='translateY('+(-22*step)+'px)';x.track.style.transition='none'});void reels.offsetHeight;await Promise.all(tracks.map(({track,c})=>new Promise(resolve=>{const duration=1320+c*190;setTimeout(()=>{track.style.transition='transform '+duration+'ms cubic-bezier(.10,.82,.12,1)';track.style.transform='translateY(0)';setTimeout(resolve,duration+40)},c*130)})))}
function drawWins(wins,total){const svg=$('paylines'),rect=svg.getBoundingClientRect();svg.innerHTML='';svg.setAttribute('viewBox','0 0 '+rect.width+' '+rect.height);wins.forEach(line=>{const points=line.map((row,c)=>{const el=reels.querySelector('[data-c="'+c+'"][data-r="'+row+'"]');if(!el)return '0,0';const b=el.getBoundingClientRect();el.classList.add('win');return (b.left+b.width/2-rect.left)+','+(b.top+b.height/2-rect.top)});const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',points.join(' '));svg.appendChild(p)});$('slotWinBanner').textContent='YOU WIN '+total.toLocaleString()+' CREDITS';$('slotWinBanner').classList.toggle('show',total>0)}
async function spin(){if(busy||!walletReady||credits<bet)return;busy=true;last=0;const roundId='ZION-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);try{credits=await RastaWallet.debit(bet,roundId)}catch(e){busy=false;$('status').textContent=e.message;save();return}save();$('status').textContent='REELS SLIDING';$('paylines').innerHTML='';$('slotWinBanner').classList.remove('show');machine.classList.add('spinning');const g=Array.from({length:3},()=>Array.from({length:3},rand));await slide(g);draw(g);let win=0,winners=[];for(const line of lines){const ids=line.map((row,c)=>g[c][row]),target=ids[0]===5?(ids[1]===5?ids[2]:ids[1]):ids[0];if(ids.every(id=>id===target||id===5)){win+=Math.round(bet/lines.length*pays[target]);winners.push(line)}}last=Math.round(win);if(last){try{credits=await RastaWallet.credit(last,roundId)}catch(e){localStorage.setItem('rasta_pending_game_payout',JSON.stringify({roundId,amount:last}));$('status').textContent='PAYOUT SYNC PENDING'}}machine.classList.remove('spinning');drawWins(winners,last);busy=false;$('status').textContent=last?'YOU WIN '+last.toLocaleString()+' CREDITS':'NO WIN · TRY AGAIN';save()}
$('spin').onclick=spin;$('minus').onclick=()=>{bet=Math.max(2,bet-2);save()};$('plus').onclick=()=>{bet=Math.min(1500,bet+2);save()};draw(Array.from({length:3},()=>Array.from({length:3},rand)));save();(async()=>{try{credits=await RastaWallet.sync();walletReady=true;const pending=JSON.parse(localStorage.getItem('rasta_pending_game_payout')||'null');if(pending){credits=await RastaWallet.credit(pending.amount,pending.roundId);localStorage.removeItem('rasta_pending_game_payout')}save()}catch(e){$('status').textContent=e.message;walletReady=false;save()}})()})();
</script></body></html>
