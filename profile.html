<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RASTA HOUSE | WALLET</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman&display=swap" rel="stylesheet">
    <style>
        :root { 
            --rasta-green: #008542; 
            --rasta-gold: #FFD100; 
            --rasta-red: #E71D36; 
            --dark: #0a0a0a; 
        }
        body { 
            background: var(--dark); 
            color: white; 
            font-family: 'Goldman', sans-serif; 
            margin: 0; 
            padding-bottom: 80px; 
        }
        header { 
            background: #111; padding: 15px; border-bottom: 2px solid var(--rasta-gold); 
            display: flex; align-items: center; 
        }
        .back-btn { 
            background: none; border: none; color: var(--rasta-gold); 
            font-size: 1.5rem; cursor: pointer; margin-right: 15px; 
        }
        .container { padding: 20px; }
        .balance-card { 
            background: linear-gradient(135deg, #1a1a1a, #000); 
            padding: 30px; border-radius: 20px; border: 1px solid var(--rasta-green); 
            text-align: center; margin-bottom: 20px;
        }
        .balance-amount { font-size: 2.5rem; color: var(--rasta-gold); margin: 10px 0; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .action-btn { 
            padding: 15px; border-radius: 12px; border: none; font-weight: bold; 
            cursor: pointer; font-family: 'Goldman'; font-size: 1rem; 
        }
        .btn-dep { background: var(--rasta-green); color: white; }
        .btn-wit { background: var(--rasta-red); color: white; }

        .form-box { 
            background: #1a1a1a; padding: 20px; border-radius: 15px; 
            border: 1px solid #333; display: none; margin-bottom: 20px;
        }
        .form-box.active { display: block; animation: slideUp 0.3s ease; }
        
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 0.8rem; }
        input, select { 
            width: 100%; padding: 12px; background: #000; border: 1px solid #444; 
            color: white; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; 
        }
        .submit-btn { 
            width: 100%; padding: 15px; background: var(--rasta-gold); color: black; 
            border: none; border-radius: 8px; font-weight: 900; cursor: pointer; 
        }
        .bank-info { 
            background: #222; padding: 15px; border-radius: 10px; 
            border-left: 4px solid var(--rasta-gold); margin-bottom: 20px; 
            font-size: 0.9rem; line-height: 1.6;
        }
        .amharic { font-family: sans-serif; font-size: 0.85rem; color: #ccc; display: block; margin-bottom: 5px; }

        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; 
            display: flex; justify-content: space-around; align-items: center; border-top: 2px solid var(--rasta-gold);
        }
        .nav-item { text-decoration: none; color: #666; font-size: 0.7rem; text-align: center; }
        .nav-item.active { color: var(--rasta-gold); }
    </style>
</head>
<body>

<header>
    <button class="back-btn" onclick="location.href='index.html'">←</button>
    <div style="font-weight: bold;">MY WALLET</div>
</header>

<div class="container">
    <div class="balance-card">
        <div style="color: var(--rasta-green); font-size: 0.8rem;">CURRENT BALANCE</div>
        <div class="balance-amount"><span id="displayBal">0.00</span> <small>ETB</small></div>
        <div id="playerID" style="color: #666; font-size: 0.8rem;">ID: LOADING...</div>
    </div>

    <div class="action-grid">
        <button class="action-btn btn-dep" onclick="showForm('deposit')">DEPOSIT</button>
        <button class="action-btn btn-wit" onclick="showForm('withdraw')">WITHDRAW</button>
    </div>

    <div id="depositForm" class="form-box">
        <h3 style="color:var(--rasta-green); margin-top:0;">Deposit Funds</h3>
        
        <label>Payment Method</label>
        <select id="depMethod" onchange="updateDetails()">
            <option value="CBE">CBE (Commercial Bank)</option>
            <option value="Telebirr">Telebirr</option>
        </select>

        <div class="bank-info">
            <span class="amharic">በዚህ ስልክ ያስገቡ (Deposit to):</span>
            <strong id="targetPhone" style="color:var(--rasta-gold); font-size:1.2rem;">0911045825</strong><br>
            <span id="targetName">Name: RASTA HOUSE</span>
        </div>
        
        <label>Amount (ETB)</label>
        <input type="number" id="depAmount" placeholder="Min: 50 ETB">
        
        <label>Sender Full Name (የላኪ ስም)</label>
        <input type="text" id="depSenderName" placeholder="Enter name on receipt">
        
        <label>Sender Phone Number (የላኪ ስልክ)</label>
        <input type="tel" id="depPhone" placeholder="09...">
        
        <button class="submit-btn" onclick="handleTransaction('Deposit')">SUBMIT REQUEST / ያስገቡ</button>
    </div>

    <div id="withdrawForm" class="form-box">
        <h3 style="color:var(--rasta-red); margin-top:0;">Withdraw Funds</h3>
        <label>Method</label>
        <select id="witMethod">
            <option value="CBE">CBE (Bank Transfer)</option>
            <option value="Telebirr">Telebirr</option>
        </select>
        <label>Amount (መጠኑ)</label>
        <input type="number" id="witAmount" placeholder="Min: 100 ETB">
        <label>Your Account / Phone (የካሽ አውት ስልክ)</label>
        <input type="text" id="witAccount" placeholder="Where to send money?">
        <button class="submit-btn" style="background:var(--rasta-red); color:white;" onclick="handleTransaction('Withdraw')">REQUEST CASHOUT</button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item">🏠<br>HOME</a>
    <a href="profile.html" class="nav-item active">💰<br>WALLET</a>
    <a href="support.html" class="nav-item">🎧<br>SUPPORT</a>
</nav>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJ78n_8B2VpNsxJKWagXOTRifs4tRYjfyq8OuQ_vKUe-MUN8iTguZYe4Q2muxAlnhJtA/exec";
    let currentUser = JSON.parse(localStorage.getItem('rasta_user'));

    if(!currentUser) { location.href = 'index.html'; }

    function showForm(type) {
        document.getElementById('depositForm').classList.remove('active');
        document.getElementById('withdrawForm').classList.remove('active');
        if(type === 'deposit') document.getElementById('depositForm').classList.add('active');
        if(type === 'withdraw') document.getElementById('withdrawForm').classList.add('active');
    }

    function updateDetails() {
        const method = document.getElementById('depMethod').value;
        const phone = document.getElementById('targetPhone');
        phone.innerText = (method === 'CBE') ? "0911045825" : "0988733637";
    }

    async function handleTransaction(type) {
        const amount = type === 'Deposit' ? document.getElementById('depAmount').value : document.getElementById('witAmount').value;
        const method = type === 'Deposit' ? document.getElementById('depMethod').value : document.getElementById('witMethod').value;
        const sender = type === 'Deposit' ? document.getElementById('depSenderName').value : 'N/A';
        const contact = type === 'Deposit' ? document.getElementById('depPhone').value : document.getElementById('witAccount').value;

        if(!amount || amount < 50) { alert("Please enter valid amount!"); return; }

        const btn = event.target;
        btn.innerText = "SENDING...";
        btn.disabled = true;

        // The "details" field combines Method, Sender Name, and Sender Phone for the sheet
        const details = `Method: ${method} | Sender: ${sender} | Info: ${contact}`;

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                    action: "transaction",
                    phone: currentUser.phone.replace(/^0+/, ''),
                    name: currentUser.name,
                    type: type,
                    amount: amount,
                    details: details
                })
            });
            alert("Sent! Request is now appearing in the approval sheet.");
            location.reload();
        } catch(e) {
            alert("Request logged.");
            location.reload();
        }
    }

    window.onload = () => {
        document.getElementById('displayBal').innerText = parseFloat(currentUser.balance || 0).toFixed(2);
        document.getElementById('playerID').innerText = "ID: " + (currentUser.id || "RH-USER");
    };
</script>
</body>
</html>
