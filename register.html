<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RASTA HOUSE | JOIN THE TRIBE</title>
    <style>
        :root { --rasta-green: #008542; --rasta-gold: #FFD100; --rasta-red: #E8112d; --dark-bg: #0a0a0a; --card-bg: rgba(20, 20, 20, 0.98); }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--dark-bg); 
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('asset/asset.bg.jpg');
            background-size: cover;
            background-position: center;
            overflow-x: hidden;
        }

        .reg-card { 
            width: 92%; 
            max-width: 400px; 
            background: var(--card-bg); 
            padding: 40px 30px; 
            border-radius: 24px; 
            border: 2px solid var(--rasta-gold); 
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .logo-area { margin-bottom: 20px; }
        .logo-area img { width: 85px; height: 85px; border-radius: 50%; border: 3px solid var(--rasta-green); padding: 5px; background: #000; }

        h2 { color: var(--rasta-gold); margin: 10px 0 5px 0; letter-spacing: 3px; font-size: 1.8rem; text-transform: uppercase; }
        .subtitle { color: var(--rasta-green); font-size: 0.9rem; margin-bottom: 30px; font-weight: 700; letter-spacing: 1px; }

        .input-group { text-align: left; margin-bottom: 20px; position: relative; }
        label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 8px; text-transform: uppercase; font-weight: 600; padding-left: 5px; }
        
        input { 
            width: 100%; 
            padding: 16px; 
            background: #000; 
            border: 1px solid #333; 
            color: white; 
            border-radius: 14px; 
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus { border-color: var(--rasta-gold); outline: none; background: #050505; box-shadow: 0 0 10px rgba(255, 209, 0, 0.2); }

        .btn-join { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, var(--rasta-green), #006432); 
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-weight: 800; 
            font-size: 1.1rem; 
            cursor: pointer; 
            margin-top: 15px; 
            box-shadow: 0 6px 0 #004d26;
            transition: all 0.2s active;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-join:active { transform: translateY(4px); box-shadow: 0 2px 0 #004d26; }
        .btn-join:disabled { background: #444; box-shadow: 0 6px 0 #222; cursor: not-allowed; opacity: 0.7; }

        .footer-link { margin-top: 25px; font-size: 0.9rem; color: #888; }
        .footer-link a { color: var(--rasta-gold); text-decoration: none; font-weight: bold; border-bottom: 1px solid transparent; transition: 0.3s; }
        .footer-link a:hover { border-bottom: 1px solid var(--rasta-gold); }

        #statusMsg { margin-top: 20px; font-size: 0.85rem; min-height: 20px; transition: 0.3s; font-weight: 600; }
        .error { color: var(--rasta-red); }
        .success { color: var(--rasta-green); }
    </style>
</head>
<body>

<div class="reg-card">
    <div class="logo-area">
        <img src="asset/asset.ui.jpg" alt="Rasta House">
    </div>
    <h2>REGISTER</h2>
    <div class="subtitle">JOIN THE TRIBE / አባል ይሁኑ</div>

    <div class="input-group">
        <label>Full Name / ሙሉ ስም</label>
        <input type="text" id="regName" placeholder="Enter your full name" autocomplete="name">
    </div>

    <div class="input-group">
        <label>Phone Number / ስልክ</label>
        <input type="tel" id="regPhone" placeholder="09... or 07..." autocomplete="tel">
    </div>

    <div class="input-group">
        <label>Create Password / የይለፍ ቃል</label>
        <input type="password" id="regPass" placeholder="Minimum 4 characters" autocomplete="new-password">
    </div>

    <button class="btn-join" id="regBtn" onclick="handleRegister()">CREATE ACCOUNT (ክፈት)</button>
    <div id="statusMsg"></div>

    <div class="footer-link">
        Already a member? <a href="login.html">Login to Tribe</a>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsHVX2FqOFl3xfoGXmnf1-7UazXSdcCSDjNzPdamDvGcDHQRwEYq58TRKQ-4NJBc4aQg/exec";

    async function handleRegister() {
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const pass = document.getElementById('regPass').value.trim();
        const btn = document.getElementById('regBtn');
        const msg = document.getElementById('statusMsg');

        // Validation
        if(!name || !phone || !pass) {
            showMsg("Please fill all required fields!", "error");
            return;
        }

        if(pass.length < 4) {
            showMsg("Password too short!", "error");
            return;
        }

        // Clean phone: Remove any leading zeros to standardize the ID
        const cleanPhone = phone.replace(/^0+/, '');

        // UI State: Loading
        btn.disabled = true;
        btn.innerText = "CONNECTING TO TRIBE...";
        msg.innerText = "";

        try {
            // Correct parameter keys to match the new Master Script v15.0
            const finalUrl = `${SCRIPT_URL}?action=register&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(cleanPhone)}&password=${encodeURIComponent(pass)}`;
            
            const response = await fetch(finalUrl);
            const data = await response.json();

            if (data.status === "success") {
                showMsg("Account Created! Welcoming you...", "success");
                
                // Initialize Session Data
                const userData = {
                    name: name,
                    phone: cleanPhone,
                    balance: 0,
                    id: data.id,
                    joined: new Date().toLocaleDateString()
                };
                
                localStorage.setItem('rasta_user', JSON.stringify(userData));
                
                // Redirect after brief success message
                setTimeout(() => { window.location.href = "index.html"; }, 1500);
            } else {
                showMsg(data.message || "Registration failed. Try a different phone.", "error");
                btn.disabled = false;
                btn.innerText = "CREATE ACCOUNT (ክፈት)";
            }
        } catch (error) {
            console.error("Reg Error:", error);
            showMsg("Server connection lost. Please check internet.", "error");
            btn.disabled = false;
            btn.innerText = "CREATE ACCOUNT (ክፈት)";
        }
    }

    function showMsg(text, type) {
        const msg = document.getElementById('statusMsg');
        msg.innerText = text;
        msg.className = type;
    }
</script>
</body>
</html>
