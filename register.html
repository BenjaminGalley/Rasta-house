<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTA HOUSE | REGISTER</title>
    <style>
        :root { --rasta-green: #008542; --rasta-gold: #FFD100; --dark: #0a0a0a; }
        body { 
            background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; 
            margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('asset/asset.bg.jpg');
            background-size: cover;
        }
        .reg-card { 
            width: 90%; max-width: 360px; background: rgba(20, 20, 20, 0.95); 
            padding: 30px; border-radius: 20px; border: 2px solid var(--rasta-gold); text-align: center;
        }
        h2 { color: var(--rasta-gold); margin-bottom: 5px; letter-spacing: 2px; }
        p { color: var(--rasta-green); font-size: 0.8rem; margin-bottom: 25px; font-weight: bold; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 0.7rem; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        input { 
            width: 100%; padding: 14px; background: #000; border: 1px solid #333; 
            color: white; border-radius: 10px; box-sizing: border-box; font-size: 1rem;
        }
        input:focus { border-color: var(--rasta-gold); outline: none; }
        .btn-join { 
            width: 100%; padding: 16px; background: var(--rasta-green); color: white; 
            border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; 
            cursor: pointer; margin-top: 20px; box-shadow: 0 4px 0 #005a2d;
        }
        .btn-join:disabled { opacity: 0.6; cursor: not-allowed; }
        .footer-link { margin-top: 20px; font-size: 0.85rem; color: #888; }
        a { color: var(--rasta-gold); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="reg-card">
    <h2>REGISTER</h2>
    <p>JOIN THE TRIBE / አባል ይሁኑ</p>

    <div class="input-group">
        <label>Full Name / ሙሉ ስም</label>
        <input type="text" id="regName" placeholder="Enter Name">
    </div>

    <div class="input-group">
        <label>Phone Number / ስልክ</label>
        <input type="tel" id="regPhone" placeholder="09... or 07...">
    </div>

    <div class="input-group">
        <label>Create Password / የይለፍ ቃል</label>
        <input type="password" id="regPass" placeholder="Min. 4 characters">
    </div>

    <button class="btn-join" id="regBtn" onclick="handleRegister()">CREATE ACCOUNT (ክፈት)</button>

    <div class="footer-link">
        Already have an account? <a href="login.html">Login Here</a>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJ78n_8B2VpNsxJKWagXOTRifs4tRYjfyq8OuQ_vKUe-MUN8iTguZYe4Q2muxAInhJtA/exec";

    async function handleRegister() {
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const pass = document.getElementById('regPass').value.trim();
        const btn = document.getElementById('regBtn');

        if(!name || !phone || !pass) return alert("Please fill all fields!");

        // Clean phone (remove leading 0)
        const cleanPhone = phone.replace(/^0+/, '');

        btn.disabled = true;
        btn.innerText = "PROCESSING...";

        try {
            const url = `${SCRIPT_URL}?action=register&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(cleanPhone)}&password=${encodeURIComponent(pass)}`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.status === "success") {
                alert("Account Created Successfully!");
                // Store user locally
                localStorage.setItem('rasta_user', JSON.stringify({
                    name: name,
                    phone: cleanPhone,
                    balance: 0,
                    id: data.id
                }));
                window.location.href = "index.html";
            } else {
                alert(data.message || "Registration Failed.");
                btn.disabled = false;
                btn.innerText = "CREATE ACCOUNT (ክፈት)";
            }
        } catch (error) {
            alert("Network Error. Check your connection.");
            btn.disabled = false;
            btn.innerText = "CREATE ACCOUNT (ክፈት)";
        }
    }
</script>
</body>
</html>
