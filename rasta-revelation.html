<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RASTA REVELATION | PROFESSIONAL 5x4</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman&display=swap" rel="stylesheet">
    <style>
        :root {
            --rasta-gold: #FFD100;
            --rasta-green: #008542;
            --rasta-red: #E71D36;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            background: #050505;
            background-image: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('asset/background.fine.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'Goldman', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* --- HEADER HUD --- */
        .header { 
            width: 100%;
            padding: 12px 20px; 
            background: rgba(0,0,0,0.9); 
            border-bottom: 2px solid var(--rasta-gold); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            z-index: 100;
            box-sizing: border-box;
        }
        .balance-box { 
            background: linear-gradient(to right, var(--rasta-green), #004d26);
            padding: 6px 18px; 
            border-radius: 25px; 
            border: 2px solid var(--rasta-gold); 
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(0, 133, 66, 0.5);
        }

        /* --- SLOT MACHINE CONTAINER --- */
        .slot-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px;
            position: relative;
        }

        .stats-overlay {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            z-index: 20;
        }

        .pill-box {
            background: rgba(0,0,0,0.85);
            border: 1.5px solid var(--rasta-gold);
            padding: 5px 20px;
            border-radius: 12px;
            text-align: center;
            min-width: 110px;
        }
        .pill-box span { font-size: 0.6rem; color: #888; display: block; text-transform: uppercase; margin-bottom: 2px; }
        .pill-box b { font-size: 1.2rem; color: var(--rasta-gold); }

        .machine-container {
            position: relative;
            width: 98%;
            max-width: 600px;
            height: 400px; /* Perfectly fits 4 rows of 100px */
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #1a1a1a;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .reel-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            padding: 0 5px;
            box-sizing: border-box;
        }

        /* Asset Implementation from Fruit.html */
        .reel-frame {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('asset/reel.frame.png') no-repeat center;
            background-size: 100% 100%;
            pointer-events: none;
            z-index: 10;
        }

        .reel-mask {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('asset/reel.mask.png') no-repeat center;
            background-size: 100% 100%;
            pointer-events: none;
            z-index: 2;
        }

        .reel-glass {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('asset/reel.glass.png') no-repeat center;
            background-size: 100% 100%;
            pointer-events: none;
            z-index: 15;
            opacity: 0.4;
        }

        .reel {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .reel-strip {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        .symbol{width:100%;height:100px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f5dfa0 0%,#b98a35 24%,#193b29 26%,#07170f 78%,#030806);border:2px solid #d8b65e;box-shadow:inset 0 0 15px #ffe9a455,0 2px 8px #000;border-radius:7px}
        .symbol img{width:85px;height:85px;object-fit:contain;filter:drop-shadow(0 5px 7px #000)}
        .symbol.payline-hit{background:linear-gradient(145deg,#fff0a5,#d99b2d 48%,#315a32);border:3px solid #fff0a8;box-shadow:0 0 18px #ffd34e,inset 0 0 12px #fff8}
        .revelation-payline{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none;overflow:visible}
        .revelation-payline polyline{fill:none;stroke:#ffeb61;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px #000) drop-shadow(0 0 8px #ffcf36);stroke-dasharray:1600;stroke-dashoffset:1600;animation:revelationLine .65s ease forwards}
        @keyframes revelationLine{to{stroke-dashoffset:0}}
        .revelation-win-banner{position:absolute;top:8px;left:50%;transform:translate(-50%,-10px);z-index:20;padding:8px 15px;border:2px solid #fff1a5;border-radius:30px;background:linear-gradient(#fff0a4,#d58d22 65%,#74400e);color:#241504;font-size:clamp(12px,3.4vw,18px);white-space:nowrap;box-shadow:0 5px 18px #000b;opacity:0;pointer-events:none}
        .revelation-win-banner.show{opacity:1;transform:translate(-50%,0);transition:.25s}

        .symbol img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            transition: transform 0.3s;
        }

        /* --- CONTROL PANEL --- */
        .control-panel {
            background: linear-gradient(to top, #000, #111);
            padding: 20px 10px 40px;
            border-top: 4px solid var(--rasta-green);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 50;
        }

        .status-text {
            color: var(--rasta-gold);
            font-size: 1.2rem;
            margin-bottom: 18px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 209, 0, 0.5);
            height: 28px;
        }

        .interaction-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .bet-unit {
            display: flex;
            align-items: center;
            background: #222;
            padding: 4px;
            border-radius: 40px;
            border: 2px solid #333;
        }

        .btn-round {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: none;
            background: var(--rasta-gold);
            color: #000;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #997a00;
        }
        .btn-round:active { transform: translateY(2px); box-shadow: 0 2px 0 #997a00; }

        .spin-trigger {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid #1a1a1a;
            background: radial-gradient(circle, var(--rasta-red), #700);
            color: white;
            font-family: 'Goldman';
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(231, 29, 54, 0.3);
            transition: 0.1s;
        }

        .spin-trigger:active:not(:disabled) { transform: scale(0.92); }
        .spin-trigger:disabled { filter: grayscale(1); opacity: 0.6; cursor: not-allowed; }

        /* Animation Classes */
        .win-pulse { animation: pulseAnim 0.8s infinite; }
        @keyframes pulseAnim {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.15); filter: brightness(1.5); }
            100% { transform: scale(1); filter: brightness(1); }
        }
    
/* Responsive reel frame and fixed bet controls */
html{min-height:100%;background:#050505}
body{height:auto;min-height:100dvh;overflow-x:hidden;overflow-y:auto;padding-bottom:185px}
.slot-wrapper{flex:none;min-height:0;padding:12px 8px 18px}
.machine-container{width:min(96vw,600px);height:min(54dvh,370px);min-height:220px;border:5px solid #c9a64d;border-radius:14px;background:radial-gradient(ellipse at 50% 40%,#171d1b,#020303 72%);box-shadow:0 0 0 2px #151006,0 0 30px #000,inset 0 0 32px #000;overflow:hidden}
.control-panel{position:fixed;left:0;right:0;bottom:0;z-index:120;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--rasta-gold)}
.status-text{height:auto;min-height:20px;margin-bottom:7px;font-size:.95rem}
.interaction-row{gap:clamp(8px,3vw,18px);flex-wrap:wrap}
.btn-round{width:42px;height:42px}
.spin-trigger{width:78px;height:78px;font-size:1.1rem}
@media(max-height:700px){.machine-container{height:40dvh;min-height:190px}.control-panel{padding-top:6px}.spin-trigger{width:66px;height:66px}}

</style>
</head>
<body>

<div class="header">
    <div onclick="location.href='index.html'" style="cursor:pointer; font-size: 1.8rem;">🏠</div>
    <div class="balance-box"><span id="userBal">0.00</span> ETB</div>
    <div onclick="toggleMusic()" id="speaker" style="cursor:pointer; font-size: 1.8rem;">🔈</div>
</div>

<div class="slot-wrapper">
    <div class="stats-overlay">
        <div class="pill-box">
            <span>TOTAL BET</span>
            <b id="betLabelTop">10.00</b>
        </div>
        <div class="pill-box" style="border-color: var(--rasta-green);">
            <span>LAST WIN</span>
            <b id="winLabelTop">0.00</b>
        </div>
    </div>

    <div class="machine-container">
        <div class="reel-viewport" id="reelViewport">
            <div class="reel-mask"></div>
            <div class="reel"><div class="reel-strip" id="reel0"></div></div>
            <div class="reel"><div class="reel-strip" id="reel1"></div></div>
            <div class="reel"><div class="reel-strip" id="reel2"></div></div>
            <div class="reel"><div class="reel-strip" id="reel3"></div></div>
            <div class="reel"><div class="reel-strip" id="reel4"></div></div>
            <div class="reel-frame"></div>
            <div class="reel-glass"></div>
            <svg class="revelation-payline" id="revelationPayline" aria-hidden="true"></svg>
            <div class="revelation-win-banner" id="revelationWinBanner"></div>
        </div>
    </div>
</div>

<div class="control-panel">
    <div class="status-text" id="statusBox">READY TO REVEAL</div>
    <div class="interaction-row">
        <div class="bet-unit">
            <button class="btn-round" onclick="adjustBet(-5)">-</button>
            <div style="width: 80px; text-align: center; color: var(--rasta-gold); font-weight: bold; font-size: 1.4rem;" id="betMid">10</div>
            <button class="btn-round" onclick="adjustBet(5)">+</button>
        </div>

        <button class="spin-trigger" id="spinBtn" onclick="spin()">SPIN</button>

        <button class="btn-round" style="background: var(--rasta-green); color: white; font-size: 0.9rem;" onclick="location.reload()">MAX</button>
    </div>
</div>

<audio id="bgMusic" loop>
    <source src="https://www.free-stock-music.com/music/alexander-nakarada-be-jammin.mp3" type="audio/mpeg">
</audio>

<script src="asset/games/wallet.js"></script><script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5oeX598AtqVX_owDmR1yKiAQ6z0fjquHzf4YJccbyBqF1GwrGnRwyFt_pVvGyGl7j/exec";
const symbols=[
 {id:'king',img:'asset/king.jpg',mult:100},
 {id:'bob',img:'asset/bob.jpg',mult:50},
 {id:'lion',img:'asset/lion.king.jpg',mult:25},
 {id:'blunt',img:'asset/blunt.jpg',mult:15},
 {id:'tree',img:'asset/tree.jpg',mult:10},
 {id:'leaf',img:'asset/mar.jpg',mult:5}
];
let user=JSON.parse(localStorage.getItem('rasta_user'))||{balance:0,phone:'000'};
let currentBet=10,isSpinning=false,landed=[],walletReady=false,currentRound='';
const $=id=>document.getElementById(id);
function init(){refreshUI();RastaWallet.sync().then(b=>{user.balance=b;walletReady=true;refreshUI()}).catch(e=>{$('statusBox').textContent=e.message});for(let i=0;i<5;i++){const strip=$('reel'+i);for(let n=0;n<70;n++){const d=symbols[Math.floor(Math.random()*symbols.length)],cell=document.createElement('div');cell.className='symbol';cell.dataset.index=n;cell.innerHTML='<img src="'+d.img+'" alt="'+d.id+'">';strip.appendChild(cell)}}}
function adjustBet(v){if(isSpinning)return;currentBet=Math.max(5,Math.min(5000,currentBet+v));refreshUI()}
function drawRevelationLine(count,amount){const svg=$('revelationPayline'),viewport=$('reelViewport'),rect=svg.getBoundingClientRect();svg.innerHTML='';svg.setAttribute('viewBox','0 0 '+rect.width+' '+rect.height);const pts=[];for(let i=0;i<count;i++){const cell=landed[i];if(!cell)continue;const b=cell.getBoundingClientRect();pts.push((b.left+b.width/2-rect.left)+','+(b.top+b.height/2-rect.top));cell.classList.add('payline-hit')}if(pts.length>1){const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',pts.join(' '));svg.appendChild(p)}$('revelationWinBanner').textContent='YOU WIN '+amount.toLocaleString()+' ETB';$('revelationWinBanner').classList.toggle('show',amount>0)}
async function spin(){if(isSpinning||!walletReady)return;if(Number(user.balance)<currentBet){alert('Insufficient Balance, Rasta!');return}isSpinning=true;currentRound='REV-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);try{user.balance=await RastaWallet.debit(currentBet,currentRound)}catch(e){isSpinning=false;$('statusBox').textContent=e.message;return}refreshUI();$('spinBtn').disabled=true;$('statusBox').textContent='REELS SLIDING';$('winLabelTop').textContent='0.00';$('revelationPayline').innerHTML='';$('revelationWinBanner').classList.remove('show');document.querySelectorAll('.symbol').forEach(x=>x.classList.remove('payline-hit'));const results=[],promises=[];landed=[];
for(let i=0;i<5;i++){const reel=$('reel'+i),height=reel.children[0].getBoundingClientRect().height||100,index=42+Math.floor(Math.random()*symbols.length);results.push(index%symbols.length);const target=reel.children[index];target.querySelector('img').src=symbols[results[i]].img;const finalIndex=index-1,startY=-(finalIndex+18)*height,stopY=-finalIndex*height;reel.style.transition='none';reel.style.transform='translateY('+startY+'px)';void reel.offsetHeight;promises.push(new Promise(resolve=>setTimeout(()=>{const duration=1320+i*190;reel.style.transition='transform '+duration+'ms cubic-bezier(.10,.82,.12,1)';reel.style.transform='translateY('+stopY+'px)';setTimeout(()=>{landed[i]=target;resolve()},duration+40)},i*110)))}await Promise.all(promises);await processWin(results)}
async function processWin(results){let win=0,count=0;const first=symbols[results[0]];if(results[0]===results[1]&&results[1]===results[2]){count=3;win=currentBet*first.mult;if(results[3]===results[0]){count=4;win*=2;if(results[4]===results[0]){count=5;win*=3}}else if(results[4]===results[0]){win*=3}}
if(win>0){try{user.balance=await RastaWallet.credit(win,currentRound)}catch(e){localStorage.setItem('rasta_pending_game_payout',JSON.stringify({roundId:currentRound,amount:win}));$('statusBox').textContent='WIN · PAYOUT SYNC PENDING'}$('winLabelTop').textContent=win.toFixed(2);$('statusBox').textContent='RASTA REVELATION · YOU WIN '+win.toLocaleString();drawRevelationLine(count,win);triggerWinEffect();refreshUI()}else{$('statusBox').textContent='NO WIN · TRY AGAIN'}
isSpinning=false;$('spinBtn').disabled=false;refreshUI()}
function triggerWinEffect(){for(let i=0;i<30;i++){const p=document.createElement('div');p.style.cssText='position:fixed;width:10px;height:10px;background:var(--rasta-gold);top:-10px;left:'+(Math.random()*100)+'%;z-index:200;border-radius:50%;';document.body.appendChild(p);let y=-10;const drop=setInterval(()=>{y+=7;p.style.top=y+'px';if(y>window.innerHeight){clearInterval(drop);p.remove()}},20)}}
function refreshUI(){$('userBal').textContent=Number(user.balance).toLocaleString(undefined,{minimumFractionDigits:2});$('betLabelTop').textContent=currentBet.toFixed(2);$('betMid').textContent=currentBet;localStorage.setItem('rasta_user',JSON.stringify(user))}
async function syncData(){try{user.balance=await RastaWallet.sync();refreshUI()}catch(e){console.warn('Authenticated wallet sync failed:',e.message)}}

</script>
</body>
</html>
