<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RASTA FRUIT RUSH | RASTA HOUSE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd34f;--green:#00d86a;--red:#ed334d;--ink:#05080b;--panel:#101820;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080b;color:#fff;font-family:Rajdhani,Arial,sans-serif}
body{display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,rgba(35,116,54,.45),transparent 55%),radial-gradient(ellipse at 5% 15%,rgba(12,105,63,.55),transparent 35%),radial-gradient(ellipse at 95% 85%,rgba(110,80,18,.25),transparent 40%),repeating-linear-gradient(135deg,#07150f 0 12px,#0a1d13 12px 24px)}
body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(ellipse at 10% 20%,#7dff8c 0 2px,transparent 3px),radial-gradient(ellipse at 85% 70%,#b5e86a 0 2px,transparent 3px);background-size:48px 52px,61px 59px;z-index:0}
.top,.stage,.controls{position:relative;z-index:1}
.top{height:64px;flex:none;display:grid;grid-template-columns:54px 1fr auto;align-items:center;padding:0 12px;background:linear-gradient(180deg,#101820,#05080b);border-bottom:2px solid var(--gold);box-shadow:0 5px 22px #0009;z-index:5}
.home{width:42px;height:42px;border:1px solid #ffffff30;border-radius:50%;background:#101820;color:white;font-size:23px}
.brand{text-align:center;font:900 clamp(15px,4vw,21px) Orbitron;letter-spacing:1px;color:var(--gold);text-shadow:0 0 14px #ffb00066}
.brand small{display:block;color:var(--green);font:800 9px Orbitron;letter-spacing:3px;margin-top:3px}
.balance{padding:8px 13px;border-radius:22px;border:1px solid var(--green);background:linear-gradient(135deg,#08783d,#04351e);font:800 13px Orbitron;white-space:nowrap}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px 6px;gap:10px}
.feature-row{width:min(100%,520px);display:flex;align-items:center;justify-content:space-between;gap:8px}
.feature-label{font:800 10px Orbitron;letter-spacing:2px;color:#cbd5c9}
.multis{display:flex;gap:7px}
.multi{width:55px;height:36px;border:1px solid #47775d;border-radius:9px;background:#0b2118;color:#a6b8aa;font:900 13px Orbitron}
.multi.active{background:linear-gradient(#28ff8b,#008d4b);color:#04150c;border:2px solid #a6ffd0;box-shadow:0 0 17px #00ff7755}
.machine{width:min(100%,520px);padding:11px;border-radius:22px;border:3px solid var(--gold);background:linear-gradient(145deg,#26302b,#080c0a 60%,#1d2922);box-shadow:0 0 0 2px #000,0 0 32px #ffcb3c30,inset 0 0 24px #000;position:relative}
.machine:before{content:"";position:absolute;inset:5px;border:1px solid #fff2;border-radius:14px;pointer-events:none}
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:7px;border-radius:13px;background:linear-gradient(180deg,#050707,#172019 48%,#050707);box-shadow:inset 0 0 18px #000}
.reel{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;min-height:clamp(225px,43vh,390px);overflow:hidden;border-radius:9px}
.cell{display:grid;place-items:center;min-height:0;border-radius:8px;background:linear-gradient(145deg,#28372d,#111a14 62%,#080c09);border:1px solid #ffffff20;box-shadow:inset 0 1px #ffffff18,0 3px 7px #000a}
.cell svg{width:min(82%,76px);height:min(82%,76px);overflow:visible;filter:drop-shadow(0 5px 4px #000b)}
.cell.win{border:2px solid #fff0a0;background:linear-gradient(145deg,#fff0a0,#c28a1e);box-shadow:0 0 20px #ffd84d;animation:winPulse .5s infinite alternate}
@keyframes winPulse{to{transform:scale(1.035);filter:brightness(1.25)}}
.reels.spinning .cell{animation:reelBlur .09s infinite alternate}
.reels.spinning .reel:nth-child(2){animation-delay:.08s}
.reels.spinning .reel:nth-child(3){animation-delay:.16s}
@keyframes reelBlur{to{filter:blur(2.5px) brightness(1.35);transform:translateY(5px)}}
.machine.celebrate{animation:machineGlow .7s ease-in-out 2}
@keyframes machineGlow{50%{box-shadow:0 0 0 3px #fff2a0,0 0 55px #ffe04f,inset 0 0 35px #e5ad24}}
.win-banner{display:none;position:absolute;z-index:4;left:8%;right:8%;top:50%;transform:translateY(-50%);padding:13px 8px;border:2px solid #fff0a0;border-radius:14px;background:linear-gradient(110deg,#174c2c,#092315);color:#ffe477;text-align:center;font:900 clamp(18px,5vw,28px) Orbitron;text-shadow:0 2px 8px #000;box-shadow:0 0 28px #ffd34f99;pointer-events:none}
.win-banner.show{display:block;animation:bannerPop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes bannerPop{from{opacity:0;scale:.7}to{opacity:1;scale:1}}
.confetti{position:fixed;z-index:30;top:-18px;width:8px;height:14px;border-radius:2px;pointer-events:none;animation:confettiFall 1.5s linear forwards}
@keyframes confettiFall{to{transform:translate(var(--drift),105vh) rotate(720deg);opacity:0}}
.status{min-height:24px;text-align:center;color:var(--gold);font:800 12px Orbitron;letter-spacing:1px;padding-top:7px}
.stats{width:min(100%,520px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.stat{background:#050a08d9;border:1px solid #ffffff20;border-radius:10px;padding:7px 5px;text-align:center}
.stat small{display:block;color:#8c9b90;font:700 9px Orbitron;letter-spacing:1px}
.stat b{display:block;color:var(--gold);font:800 16px Orbitron;margin-top:4px}
.controls{flex:none;width:100%;padding:9px 12px calc(10px + var(--safe));background:linear-gradient(180deg,#121a17,#030605);border-top:2px solid #c99a22;box-shadow:0 -8px 25px #000a;z-index:8}
.control-inner{width:min(100%,520px);margin:auto;display:grid;grid-template-columns:54px minmax(0,1fr) 54px;gap:10px;align-items:center}
.bet-step{height:58px;border:1px solid #ffe08a;border-radius:13px;background:linear-gradient(160deg,#f8dc78,#a96c0c);color:#211600;font:900 30px Orbitron;box-shadow:0 4px 0 #60400b,0 0 16px #ffcb3c35;touch-action:manipulation}
.bet-select{position:relative;min-width:0}
.bet-main{width:100%;height:58px;border:2px solid #fff0a4;border-radius:14px;background:linear-gradient(145deg,#164e32,#071c12 65%,#1c3c25);color:#ffe17a;box-shadow:inset 0 0 12px #000,0 4px 0 #061009,0 0 18px #00df7140;display:flex;align-items:center;justify-content:center;gap:12px;touch-action:manipulation}
.bet-main strong{font:900 clamp(19px,5vw,25px) Orbitron}
.bet-main span{font:900 20px Orbitron;color:#e9c65d}
.bet-main small{font:800 8px Orbitron;letter-spacing:1.5px;color:#b8d4bc;display:block}
.bet-menu{display:none;position:absolute;bottom:calc(100% + 12px);left:0;right:0;z-index:15;padding:8px;border:2px solid #f3ca4e;border-radius:14px;background:linear-gradient(145deg,#1b2c20f5,#080d0bf7);box-shadow:0 0 28px #000d,0 0 20px #ffc83b35}
.bet-menu.open{display:block}
.bet-options{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:thin}
.bet-option{flex:0 0 auto;min-width:62px;padding:11px 9px;border:1px solid #657a5e;border-radius:9px;background:#101d15;color:#fff;font:800 14px Orbitron;scroll-snap-align:center}
.bet-option.active{background:linear-gradient(#ffe78b,#b77a12);color:#211600;border-color:#fff0a4;box-shadow:0 0 13px #ffd34f88}
.bet-hint{text-align:center;color:#c7d6c9;font:700 9px Orbitron;letter-spacing:1px;padding-top:3px}
.spin{height:62px;border:2px solid #fff0a4;border-radius:50px;background:radial-gradient(ellipse at 50% 15%,#fff3a1,#ffd12f 42%,#a96500);color:#231600;font:900 18px Orbitron;letter-spacing:1px;box-shadow:0 5px 0 #69420b,0 0 18px #ffca3d66;touch-action:manipulation}
.spin:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #69420b}.spin:disabled{filter:grayscale(1);opacity:.55}
.bottomline{display:flex;justify-content:center;gap:14px;margin-top:8px}
.linkbtn{border:0;background:transparent;color:#aeb9af;font:700 11px Rajdhani;padding:5px 10px}
.notice{font:600 9px Rajdhani;color:#65746a;text-align:center;margin-top:4px}
@media(max-height:700px){.top{height:55px}.stage{gap:6px;padding:5px 9px}.reel{min-height:clamp(160px,35vh,250px)}.machine{padding:7px}.reels{gap:5px;padding:5px}.cell svg{width:72%;height:72%}.controls{padding-top:6px}.spin{height:54px}.status{min-height:18px;padding-top:3px}}
</style></head><body>
<header class="top"><button class="home" onclick="location.href='index.html'" aria-label="Back to lobby">×</button><div class="brand">RASTA FRUIT RUSH<small>JUNGLE EDITION · DEMO PLAY</small></div><div class="balance"><span id="balance">0.00</span></div></header>
<main class="stage">
 <div class="feature-row"><span class="feature-label">MULTIPLIER BOOST</span><div class="multis"><button class="multi" data-m="1">1×</button><button class="multi active" data-m="2">2×</button><button class="multi" data-m="4">4×</button></div></div>
 <section class="machine" id="machine"><div class="reels" id="reels"><div class="reel"></div><div class="reel"></div><div class="reel"></div></div><div class="win-banner" id="winBanner"></div><div class="status" id="status">READY TO SPIN</div></section>
 <div class="stats"><div class="stat"><small>BET</small><b id="betTop">2.00</b></div><div class="stat"><small>LAST WIN</small><b id="winTop">0.00</b></div><div class="stat"><small>PAYLINES</small><b>5</b></div></div>
</main>
<footer class="controls"><div class="control-inner">
 <button class="bet-step" id="minus" aria-label="Previous bet">−</button>
 <div class="bet-select"><button class="bet-main" id="betToggle" aria-label="Choose bet amount"><span>$</span><div><small>BET VALUE</small><strong id="bet">2</strong></div><span>⌄</span></button>
 <div class="bet-menu" id="betMenu"><div class="bet-options" id="betOptions"></div><div class="bet-hint">SWIPE TO CHOOSE · UP TO 1,000 DEMO CREDITS</div></div></div>
 <button class="bet-step" id="plus" aria-label="Next bet">+</button>
 </div><div style="width:min(100%,520px);margin:10px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:center">
 <div class="betbox"><small>WIN</small><b id="winBottom" style="display:block;color:#00e879;font:900 15px Orbitron;margin-top:8px">0.00</b></div>
 <button class="spin" id="spin">SPIN</button></div><div class="bottomline"><button class="linkbtn" id="rules">PAYTABLE & RULES</button><button class="linkbtn" id="sound">♪ SOUND: OFF</button><button class="linkbtn" id="reset">RESET DEMO</button></div><div class="notice">DEMO CREDITS ONLY · NO REAL-MONEY PLAY OR PAYOUTS</div></footer>
<div id="soundPrompt" style="display:none;position:fixed;inset:0;z-index:20;background:#000b;align-items:center;justify-content:center;padding:24px"><div style="width:min(100%,420px);padding:28px 20px;border:2px solid #ffd34f;border-radius:18px;background:linear-gradient(145deg,#182c20,#090e0b);box-shadow:0 0 35px #ffc83d55;text-align:center"><div style="font:800 22px Orbitron;color:#ffe08a;margin-bottom:24px">WOULD YOU LIKE SOUND?</div><div style="display:flex;gap:12px"><button id="soundYes" style="flex:1;padding:16px 8px;border:1px solid #b8ffb8;border-radius:10px;background:linear-gradient(#24d875,#08763e);color:#fff;font:800 16px Rajdhani">♫ YES</button><button id="soundNo" style="flex:1;padding:16px 8px;border:1px solid #aaa;border-radius:10px;background:#343a36;color:#fff;font:800 16px Rajdhani">♩ NO</button></div></div></div>
<script>
const SPRITE='asset/slot-symbols.svg';
const SYMBOLS=[['seven',20],['wild',12],['grapes',8],['cherry',7],['orange',6],['watermelon',5],['lemon',4],['plum',3],['bell',2]];
const USER_KEY='rasta_user';let user=JSON.parse(localStorage.getItem(USER_KEY)||'null')||{balance:500,phone:'000'};if(!Number.isFinite(Number(user.balance)))user.balance=500;
const BET_VALUES=[2,4,5,8,10,15,20,30,40,50,75,100,150,200,300,500,750,1000];
let bet=2,multiplier=2,busy=false,soundOn=false,lastGrid=[];
const reels=document.getElementById('reels');
const betMenu=document.getElementById('betMenu'),betOptions=document.getElementById('betOptions');
function renderBetOptions(){betOptions.innerHTML='';BET_VALUES.forEach(value=>{const b=document.createElement('button');b.className='bet-option'+(value===bet?' active':'');b.textContent=value;b.type='button';b.onclick=()=>selectBet(value);betOptions.appendChild(b)})}
function selectBet(value){if(busy)return;bet=value;renderBetOptions();betMenu.classList.remove('open');refresh()}
function stepBet(direction){const i=BET_VALUES.indexOf(bet);selectBet(BET_VALUES[Math.max(0,Math.min(BET_VALUES.length-1,i+direction))])}
document.getElementById('betToggle').onclick=()=>{if(busy)return;betMenu.classList.toggle('open');if(betMenu.classList.contains('open'))betOptions.querySelector('.active')?.scrollIntoView({block:'nearest',inline:'center'})};
document.getElementById('minus').onclick=()=>stepBet(-1);
document.getElementById('plus').onclick=()=>stepBet(1);
document.addEventListener('click',e=>{if(!e.target.closest('.bet-select'))betMenu.classList.remove('open')});
function icon(id){return '<svg viewBox="0 0 120 120" role="img" aria-label="'+id+'"><use href="'+SPRITE+'#sym-'+id+'"></use></svg>'}
function randomSymbol(){const weights=[5,4,8,9,10,9,11,11,8];let n=Math.random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<weights.length;i++){n-=weights[i];if(n<=0)return SYMBOLS[i][0]}return 'bell'}
function drawGrid(grid){reels.innerHTML='';for(let c=0;c<3;c++){const reel=document.createElement('div');reel.className='reel';for(let r=0;r<3;r++){const cell=document.createElement('div');cell.className='cell';cell.dataset.col=c;cell.dataset.row=r;cell.innerHTML=icon(grid[c][r]);reel.appendChild(cell)}reels.appendChild(reel)}}
function refresh(){document.getElementById('balance').textContent=Number(user.balance).toFixed(2);document.getElementById('bet').textContent=bet;document.getElementById('betTop').textContent=(bet*multiplier).toFixed(2);document.getElementById('spin').disabled=busy||Number(user.balance)<bet*multiplier;localStorage.setItem(USER_KEY,JSON.stringify(user))}
function setStatus(s){document.getElementById('status').textContent=s}
function beep(freq=540){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.stop(c.currentTime+.16)}catch(e){}}
function pay(grid){const lines=[[0,0,0],[1,1,1],[2,2,2],[0,1,2],[2,1,0]];let total=0,winners=[];for(const line of lines){const ids=line.map((r,c)=>grid[c][r]);let base=ids.find(x=>x!=='wild')||'wild';if(ids.every(x=>x===base||x==='wild')){total+=bet*multiplier*(SYMBOLS.find(x=>x[0]===base)?.[1]||10);winners.push(line)}else if(ids[0]===ids[1]||ids[0]==='wild'&&ids[1]===ids[2]){if(ids[0]===ids[1]||ids[1]==='wild') {total+=bet*multiplier*2;winners.push(line)}}}return {total,winners}}
async function spin(){if(busy)return;const stake=bet*multiplier;if(Number(user.balance)<stake){setStatus('NOT ENOUGH DEMO CREDITS');return}
busy=true;document.getElementById('winBanner').classList.remove('show');document.getElementById('machine').classList.remove('celebrate');
user.balance=Number(user.balance)-stake;document.getElementById('winTop').textContent='0.00';document.getElementById('winBottom').textContent='0.00';refresh();document.getElementById('spin').textContent='SPINNING';setStatus('GOOD LUCK · REELS IN MOTION');reels.classList.add('spinning');beep(260);
const ticker=setInterval(()=>{const moving=Array.from({length:3},()=>Array.from({length:3},randomSymbol));drawGrid(moving);reels.classList.add('spinning')},95);
await new Promise(r=>setTimeout(r,850));clearInterval(ticker);
const grid=Array.from({length:3},()=>Array.from({length:3},randomSymbol));drawGrid(grid);reels.classList.remove('spinning');
const result=pay(grid);if(result.total>0){user.balance+=result.total;setStatus('BIG WIN · '+result.total.toFixed(2)+' DEMO CREDITS');document.getElementById('winTop').textContent=result.total.toFixed(2);document.getElementById('winBottom').textContent=result.total.toFixed(2);
for(const line of result.winners)line.forEach((r,c)=>reels.querySelector('[data-col="'+c+'"][data-row="'+r+'"]')?.classList.add('win'));
const banner=document.getElementById('winBanner');banner.textContent='★ WIN '+result.total.toFixed(2)+' ★';banner.classList.add('show');document.getElementById('machine').classList.add('celebrate');celebrate();beep(880);
}else setStatus('NO WIN · TRY AGAIN');busy=false;document.getElementById('spin').textContent='SPIN';refresh()}
function celebrate(){for(let i=0;i<34;i++){const bit=document.createElement('i');bit.className='confetti';bit.style.left=(Math.random()*100)+'vw';bit.style.setProperty('--drift',((Math.random()-.5)*180)+'px');bit.style.background=['#ffd34f','#00e879','#ff5470','#fff1a8'][i%4];bit.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(bit);setTimeout(()=>bit.remove(),2100)}}
document.getElementById('spin').onclick=spin;document.querySelectorAll('.multi').forEach(b=>b.onclick=()=>{if(!busy){multiplier=Number(b.dataset.m);document.querySelectorAll('.multi').forEach(x=>x.classList.toggle('active',x===b));refresh()}});document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent='♪ SOUND: '+(soundOn?'ON':'OFF');beep(640)};
const soundPrompt=document.getElementById('soundPrompt');if(!localStorage.getItem('rasta_sound_choice'))soundPrompt.style.display='flex';function chooseSound(on){soundOn=on;localStorage.setItem('rasta_sound_choice',on?'yes':'no');document.getElementById('sound').textContent='♪ SOUND: '+(on?'ON':'OFF');soundPrompt.style.display='none';if(on)beep(640)}document.getElementById('soundYes').onclick=()=>chooseSound(true);document.getElementById('soundNo').onclick=()=>chooseSound(false);document.getElementById('reset').onclick=()=>{if(!busy&&confirm('Reset this device to 500 demo credits?')){user.balance=500;refresh();setStatus('DEMO CREDITS RESET')}};document.getElementById('rules').onclick=()=>alert('Five paylines: three horizontal rows and two diagonals. Three matching symbols or WILD substitutions on a line award demo credits. Payout values are shown by symbol value. All play is simulated locally.');renderBetOptions();drawGrid([['seven','cherry','orange'],['cherry','seven','grapes'],['orange','watermelon','seven']]);refresh();
</script></body></html>
