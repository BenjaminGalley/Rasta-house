<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTA HOUSE | LOGIN</title>
    <style>
        :root { --rasta-green: #008542; --rasta-gold: #FFD100; --dark: #0a0a0a; }
        body { 
            background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; 
            margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('asset/asset.bg.jpg');
            background-size: cover;
        }
        .login-card { 
            width: 90%; max-width: 360px; background: rgba(20, 20, 20, 0.95); 
            padding: 30px; border-radius: 20px; border: 2px solid var(--rasta-gold); text-align: center;
        }
        h2 { color: var(--rasta-gold); margin-bottom: 25px; letter-spacing: 2px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 0.7rem; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        input { 
            width: 100%; padding: 14px; background: #000; border: 1px solid #333; 
            color: white; border-radius: 10px; box-sizing: border-box; font-size: 1rem;
        }
        input:focus { border-color: var(--rasta-gold); outline: none; }
        .btn-login { 
            width: 100%; padding: 16px; background: var(--rasta-green); color: white; 
            border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; 
            cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #005a2d;
        }
        .btn-login:disabled { opacity: 0.6; }
        #msg { margin-top: 15px; color: var(--rasta-gold); font-size: 0.9rem; }
        .footer-link { margin-top: 25px; font-size: 0.85rem; color: #888; }
        a { color: var(--rasta-gold); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-card">
    <img src="asset/asset.ui.jpg" style="width:70px; border-radius:50%; border:2px solid var(--rasta-green); margin-bottom:10px;">
    <h2>PLAYER LOGIN</h2>

    <div class="input-group">
        <label>Phone Number / ስልክ</label>
        <input type="tel" id="loginPhone" placeholder="09... or 07...">
    </div>

    <div class="input-group">
        <label>Password / የይለፍ ቃል</label>
        <input type="password" id="loginPass" placeholder="••••••••">
    </div>

    <button class="btn-login" id="loginBtn" onclick="handleLogin()">SECURE LOGIN (ግባ)</button>
    <div id="msg"></div>

    <div class="footer-link">
        New Player? <a href="register.html">Create Account</a>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJ78n_8B2VpNsxJKWagXOTRifs4tRYjfyq8OuQ_vKUe-MUN8iTguZYe4Q2muxAInhJtA/exec";

    async function handleLogin() {
        const phone = document.getElementById('loginPhone').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        const btn = document.getElementById('loginBtn');
        const msg = document.getElementById('msg');

        if(!phone || !pass) return alert("Enter Phone and Password!");

        const cleanPhone = phone.replace(/^0+/, '');
        btn.disabled = true;
        msg.innerText = "Verifying Tribe Member...";

        try {
            const url = `${SCRIPT_URL}?action=login&phone=${encodeURIComponent(cleanPhone)}&password=${encodeURIComponent(pass)}&t=${Date.now()}`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.status === "success") {
                msg.style.color = "#00FF88";
                msg.innerText = "Welcome back, " + data.name + "!";
                
                // Save complete user data
                localStorage.setItem('rasta_user', JSON.stringify({
                    name: data.name,
                    phone: cleanPhone,
                    balance: data.balance
                }));

                setTimeout(() => { window.location.href = "index.html"; }, 1200);
            } else {
                alert("Login Failed! Check phone or password.");
                btn.disabled = false;
                msg.innerText = "";
            }
        } catch (error) {
            alert("Error connecting to Rasta Server.");
            btn.disabled = false;
            msg.innerText = "";
        }
    }
</script>
</body>
</html>
