<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRIP REVELATION | PREMIUM SLOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #FFD100; --green: #008542; --red: #E71D36; 
            --dark: #000000;
        }
        
        body { 
            background: #000 url('asset/background.fine.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white; 
            font-family: 'Goldman', cursive; 
            margin: 0; padding: 0;
            overflow: hidden; 
            display: flex; flex-direction: column; 
            height: 100vh;
        }

        /* --- TOP NAVIGATION --- */
        .top-nav { 
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }

        .stats-group {
            display: flex;
            gap: 12px;
        }

        .stat-display {
            background: rgba(0,0,0,0.8);
            padding: 5px 15px;
            border-radius: 8px;
            border: 1px solid var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
        }
        .stat-label { font-size: 0.6rem; color: #aaa; text-transform: uppercase; margin-bottom: 2px; }
        .stat-value { color: var(--gold); font-weight: 900; font-size: 1.1rem; }

        /* --- 5x4 PRO GRID --- */
        .stage {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            padding: 10px;
        }

        .grid-frame {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border: 4px solid #000; /* Solid Black Border */
            border-radius: 10px;
            width: 95vw; max-width: 550px;
            height: 480px; 
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* Vertical Reel Strip */
        .reel-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1.5px solid #000; /* Vertical Grid divider */
        }
        .reel-column:last-child { border-right: none; }

        .slot-item {
            width: 100%;
            height: var(--trip-cell,108px);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            background: transparent; /* No icon frame */
            border-bottom: 1.5px solid #000; /* Horizontal Grid divider */
        }

        .slot-item img {
            width: 85%; height: 85%;
            object-fit: contain;
            /* Makes icons pop against the background without a frame */
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
        }

        .blur-fx { filter: blur(3px) brightness(1.1); }

        /* --- CONTROL CONSOLE --- */
        .console {
            background: linear-gradient(to top, #000 80%, transparent);
            padding: 20px 10px;
            text-align: center;
            z-index: 100;
        }

        .info-display {
            margin-bottom: 15px;
            font-size: 1.3rem;
            color: var(--gold);
            text-shadow: 0 0 8px rgba(255, 209, 0, 0.4);
        }

        .dashboard {
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 600px; margin: 0 auto;
        }

        .bet-buttons { display: flex; align-items: center; gap: 20px; }

        .btn-ui {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            background: #111;
            color: var(--gold);
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-ui:active { transform: scale(0.9); background: var(--gold); color: #000; }

        .spin-master {
            background: linear-gradient(135deg, var(--green), #004d26);
            border: none;
            padding: 15px 55px;
            border-radius: 40px;
            color: white;
            font-family: 'Goldman';
            font-size: 1.9rem;
            font-weight: 900;
            box-shadow: 0 6px 0 #002e17;
            cursor: pointer;
        }
        .spin-master:active { transform: translateY(3px); box-shadow: 0 3px 0 #002e17; }
        .spin-master:disabled { filter: grayscale(1); opacity: 0.5; }

        #mega-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 60;
        }

    
/* Responsive game controls stay visible on phone */
html{min-height:100%;background:#000}
body{height:auto;min-height:100dvh;overflow-x:hidden;overflow-y:auto;padding-bottom:190px}
.stage{flex:none;min-height:42dvh;padding:12px 8px}
.grid-frame{width:min(96vw,550px);height:min(62dvh,400px);min-height:220px;--trip-cell:calc(min(62dvh,400px) / 4);border:5px solid #c9a64d;background:radial-gradient(ellipse at 50% 40%,#202820,#050706 72%);box-shadow:0 0 0 2px #080a08,0 0 30px #c99a3440,inset 0 0 35px #000}
.console{position:fixed;left:0;right:0;bottom:0;z-index:120;padding:9px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#050805f2,#000);border-top:2px solid var(--gold)}
.info-display{font-size:1rem;margin-bottom:8px;height:auto;min-height:20px}
.dashboard{gap:10px;flex-wrap:wrap}
.bet-buttons{gap:10px}
.btn-ui{width:44px;height:44px}
.spin-master{padding:12px 28px;font-size:1.3rem}
@media(max-height:700px){.stage{min-height:34dvh}.grid-frame{height:34dvh;min-height:190px;--trip-cell:calc(34dvh / 4)}.console{padding-top:6px}.info-display{margin-bottom:5px}}

</style>
</head>
<body>

<canvas id="mega-canvas"></canvas>

<div class="top-nav">
    <div onclick="location.href='index.html'" style="cursor:pointer; font-size: 1.8rem;">🏠</div>
    
    <div class="stats-group">
        <div class="stat-display">
            <span class="stat-label">Total Bet</span>
            <span class="stat-value" id="betValTop">4</span>
        </div>
        <div class="stat-display">
            <span class="stat-label">Balance</span>
            <span class="stat-value" id="balDisplay">0.00 ETB</span>
        </div>
    </div>

    <div onclick="toggleSound()" id="soundIcon" style="cursor:pointer; font-size: 1.8rem;">🔈</div>
</div>

<div class="stage">
    <div class="grid-frame" id="tripGrid">
        <div class="reel-column" id="r0"></div>
        <div class="reel-column" id="r1"></div>
        <div class="reel-column" id="r2"></div>
        <div class="reel-column" id="r3"></div>
        <div class="reel-column" id="r4"></div><svg id="tripPaylines" aria-hidden="true"></svg>
    </div>
</div>

<div class="console">
    <div class="info-display" id="msgBox">READY TO TRIP</div>
    <div class="dashboard">
        <div class="bet-buttons">
            <button class="btn-ui" onclick="modBet(-4)">-</button>
            <button class="btn-ui" onclick="modBet(4)">+</button>
        </div>

        <button class="spin-master" id="spinBtn" onclick="runGame()">SPIN</button>

        <div class="stat-display" style="border-color: #fff;">
            <span class="stat-label">Last Win</span>
            <span class="stat-value" id="winAmt" style="color: #fff;">0</span>
        </div>
    </div>
</div>

<audio id="audioTrack" loop>
    <source src="https://www.free-stock-music.com/music/alexander-nakarada-be-jammin.mp3" type="audio/mpeg">
</audio>

<script src="asset/games/wallet.js"></script><script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycby5oeX598AtqVX_owDmR1yKiAQ6z0fjquHzf4YJccbyBqF1GwrGnRwyFt_pVvGyGl7j/exec";
let state=JSON.parse(localStorage.getItem('rasta_user'))||{balance:500,phone:'000'},currentBet=4,isActive=false,walletReady=false,currentRound='';
const payTable=[{id:'king',src:'asset/king.jpg',m:500,w:2},{id:'bob',src:'asset/bob.jpg',m:200,w:4},{id:'lion',src:'asset/lion.king.jpg',m:100,w:8},{id:'blunt',src:'asset/blunt.jpg',m:50,w:12},{id:'tree',src:'asset/tree.jpg',m:20,w:20},{id:'leaf',src:'asset/mar.jpg',m:10,w:30}];
let mathPool=[];payTable.forEach((s,i)=>{for(let n=0;n<s.w;n++)mathPool.push(i)});
const $=id=>document.getElementById(id);
function init(){refreshUI();RastaWallet.sync().then(b=>{state.balance=b;walletReady=true;refreshUI()}).catch(e=>{$('msgBox').textContent=e.message});for(let i=0;i<5;i++)buildReel(i)}
function buildReel(id){const r=$('r'+id);r.innerHTML='';for(let i=0;i<30;i++){const d=document.createElement('div'),sym=mathPool[Math.floor(Math.random()*mathPool.length)];d.className='slot-item';d.innerHTML='<img src="'+payTable[sym].src+'">';r.appendChild(d)}}
function modBet(n){if(isActive)return;currentBet=Math.max(4,currentBet+n);$('betValTop').textContent=currentBet;refreshUI()}
async function runGame(){if(isActive||!walletReady||Number(state.balance)<currentBet)return;isActive=true;currentRound='TRIP-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);try{state.balance=await RastaWallet.debit(currentBet,currentRound)}catch(e){isActive=false;$('msgBox').textContent=e.message;return}refreshUI();$('spinBtn').disabled=true;$('msgBox').textContent='REELS SLIDING';$('winAmt').textContent='0';$('tripPaylines').innerHTML='';document.querySelectorAll('.trip-hit').forEach(x=>x.classList.remove('trip-hit'));
const grid=[],promises=[];
for(let c=0;c<5;c++){const reel=$('r'+c),height=reel.querySelector('.slot-item').getBoundingClientRect().height||108,result=Array.from({length:4},()=>mathPool[Math.floor(Math.random()*mathPool.length)]);grid.push(result);for(let row=0;row<4;row++)reel.children[row].querySelector('img').src=payTable[result[row]].src;reel.style.transition='none';reel.style.transform='translateY('+(-25*height)+'px)';void reel.offsetHeight;promises.push(new Promise(resolve=>setTimeout(()=>{const duration=2100+c*340;reel.style.transition='transform '+duration+'ms cubic-bezier(.12,.72,.16,1)';reel.style.transform='translateY(0)';setTimeout(resolve,duration+40)},c*120)))}
await Promise.all(promises);await calculateLogic(grid);isActive=false;$('spinBtn').disabled=false;refreshUI()}
async function calculateLogic(grid){let total=0,wins=[];for(let row=0;row<4;row++){const symbol=grid[0][row];let count=1;for(let col=1;col<5;col++){if(grid[col][row]===symbol)count++;else break}if(count>=3){const amount=Math.round(currentBet*(payTable[symbol].m/10)*(count-2));total+=amount;wins.push({row,count,amount})}}
if(total>0){try{state.balance=await RastaWallet.credit(total,currentRound)}catch(e){localStorage.setItem('rasta_pending_game_payout',JSON.stringify({roundId:currentRound,amount:total}));$('msgBox').textContent='WIN · PAYOUT SYNC PENDING'}$('msgBox').textContent='YOU WIN '+total.toLocaleString()+' CREDITS';$('winAmt').textContent=total.toLocaleString();const svg=$('tripPaylines'),rect=svg.getBoundingClientRect();svg.setAttribute('viewBox','0 0 '+rect.width+' '+rect.height);wins.forEach(w=>{const points=[];for(let col=0;col<w.count;col++){const cell=$('r'+col).children[w.row],b=cell.getBoundingClientRect();cell.classList.add('trip-hit');points.push((b.left+b.width/2-rect.left)+','+(b.top+b.height/2-rect.top))}const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',points.join(' '));svg.appendChild(p)});burstCoins()}else{$('msgBox').textContent='NO WIN · TRY AGAIN';$('winAmt').textContent='0'}refreshUI()}
function refreshUI(){$('balDisplay').textContent=Number(state.balance).toFixed(2)+' ETB';$('betValTop').textContent=currentBet;localStorage.setItem('rasta_user',JSON.stringify(state))}
async function syncBalance(){try{state.balance=await RastaWallet.sync();refreshUI()}catch(e){console.warn('Authenticated wallet sync failed:',e.message)}}

</script>
</body>
</html>
<style>
#tripGrid{position:relative}
#tripPaylines{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}
#tripPaylines polyline{fill:none;stroke:#fff06a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #000) drop-shadow(0 0 9px #ffd84a);stroke-dasharray:1300;stroke-dashoffset:1300;animation:tripLine .65s ease forwards}
@keyframes tripLine{to{stroke-dashoffset:0}}
#tripGrid .slot-item.trip-hit{background:linear-gradient(145deg,#fff0a8,#c99532 55%,#345b36);box-shadow:inset 0 0 12px #fff8,0 0 13px #ffd44e}
</style>
