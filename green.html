<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GREEN | PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Goldman&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #FFD700; 
            --bright-green: #2ebd47;
            --dark-bg: #011a06;
            --neon-win: #00ff41;
        }

        body {
            margin: 0; background: var(--dark-bg); color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; overflow: hidden;
            background: radial-gradient(circle, #0a4f15, #011a06);
        }

        /* --- TOP NAV --- */
        .top-bar {
            width: 100%; padding: 10px 20px; display: flex; justify-content: space-between;
            align-items: center; background: rgba(0,0,0,0.8); border-bottom: 2px solid var(--gold);
            box-sizing: border-box; z-index: 10;
        }

        .logo { font-family: 'Goldman'; color: var(--gold); font-size: 1.2rem; letter-spacing: 2px; }

        /* --- GAME TABLE --- */
        .stage {
            flex: 1; display: flex; align-items: center; justify-content: center; width: 100%;
        }

        .slot-machine {
            width: 350px; height: 320px;
            background: url("data:image/svg+xml,%3Csvg width='1000' height='900' viewBox='0 0 1000 900' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3CradialGradient id='f' cx='50%25' cy='50%25' r='70%25'%3E%3Cstop offset='0%25' style='stop-color:%230f5e28' /%3E%3Cstop offset='100%25' style='stop-color:%23022b0a' /%3E%3C/radialGradient%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23bf953f' /%3E%3Cstop offset='50%25' style='stop-color:%23b38728' /%3E%3Cstop offset='100%25' style='stop-color:%23aa771c' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='1000' height='900' fill='url(%23f)' /%3E%3Crect x='330' y='20' width='12' height='860' fill='url(%23g)' rx='6' /%3E%3Crect x='658' y='20' width='12' height='860' fill='url(%23g)' rx='6' /%3E%3Crect width='1000' height='900' fill='none' stroke='url(%23g)' stroke-width='30' rx='25' /%3E%3C/svg%3E") no-repeat center;
            background-size: 100% 100%;
            display: flex; padding: 25px; box-sizing: border-box; gap: 10px; position: relative;
        }

        .reel-window { flex: 1; height: 100%; overflow: hidden; position: relative; border-radius: 10px; background: rgba(0,0,0,0.1); }
        .reel-strip { position: absolute; width: 100%; top: 0; will-change: transform; }
        
        .symbol { width: 100%; height: var(--green-cell,90px); display: flex; align-items: center; justify-content: center; }
        .symbol img { width: 75px; height: 75px; object-fit: contain; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.5)); }

        /* --- DASHBOARD CONTROLS --- */
        .dashboard {
            width: 100%; background: linear-gradient(to top, #000, #051a08); 
            border-top: 3px solid var(--gold); padding: 8px 0 calc(10px + env(safe-area-inset-bottom, 0px)); flex:none;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        .live-stats {
            display: flex; justify-content: space-around; width: 95%; max-width: 450px;
            background: rgba(255,255,255,0.05); padding: 10px; border-radius: 15px; border: 1px solid #222;
        }

        .stat-item { text-align: center; }
        .stat-label { font-size: 0.65rem; color: #888; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .stat-val { font-size: 1.1rem; font-weight: 900; color: #fff; }
        .stat-val.gold { color: var(--gold); }
        .stat-val.neon { color: var(--neon-win); text-shadow: 0 0 10px rgba(0,255,65,0.4); }

        .interaction-row {
            display: flex; align-items: center; gap: 25px; width: 90%; justify-content: center;
        }

        .bet-stepper {
            display: flex; align-items: center; background: #000; border: 2px solid #333; border-radius: 50px; padding: 4px;
        }

        .btn-round {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: var(--gold); color: #000; font-size: 1.5rem; font-weight: 900; cursor: pointer;
        }

        .spin-trigger {
            width: 88px; height: 88px; border-radius: 50%;
            background: radial-gradient(circle, #34e05b, #0b4f18);
            border: 5px solid #fff; color: white; font-weight: 900; font-size: 1.4rem;
            cursor: pointer; box-shadow: 0 8px 0 #022b0a, 0 0 30px rgba(46,189,71,0.3);
            transition: all 0.1s; font-family: 'Goldman';
        }

        .spin-trigger:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #022b0a; }
        .spin-trigger:disabled { filter: grayscale(1); opacity: 0.5; }

        /* Animations */
        @keyframes winGlow {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.8) drop-shadow(0 0 15px var(--neon-win)); }
            100% { filter: brightness(1); }
        }
        .winner-reel { animation: winGlow 0.5s ease infinite; }
    
/* Rasta House mobile fit + framed machine */
html{min-height:100%;background:#011a06}
body{height:auto;min-height:100dvh;overflow-x:hidden;overflow-y:auto;padding-bottom:190px}
.top-bar{flex:none}
.stage{flex:none;min-height:38dvh;padding:12px 10px 18px;align-items:center;justify-content:center}
.slot-machine{width:min(92vw,390px);height:min(76vw,320px);min-height:220px;border:5px solid #d6b04a;border-radius:22px;box-shadow:0 0 0 2px #251b08,0 0 32px #00b83f55,inset 0 0 18px #000;overflow:hidden}
.dashboard{position:fixed;left:0;right:0;bottom:0;z-index:100;width:100%;padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px));gap:12px;border-top:3px solid var(--gold);box-shadow:0 -8px 24px #000d}
.live-stats{padding:7px 5px;width:min(100%,460px)}
.interaction-row{width:100%;gap:clamp(12px,5vw,25px);flex-wrap:wrap}
.spin-trigger{width:76px;height:76px;font-size:1.1rem}
.btn-round{width:42px;height:42px;min-width:42px}
@media(max-height:700px){.stage{min-height:34dvh;padding:8px}.slot-machine{height:min(62vw,245px);min-height:190px}.dashboard{gap:7px;padding-top:7px}.live-stats{padding:6px}.spin-trigger{width:64px;height:64px}}

</style>
<style>
#machineFrame{position:relative}
#greenPayline{position:absolute;inset:0;width:100%;height:100%;z-index:12;pointer-events:none;overflow:visible}
#greenPayline polyline{fill:none;stroke:#fff06a;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #000) drop-shadow(0 0 10px #ffe04b);stroke-dasharray:1200;stroke-dashoffset:1200;animation:greenLine .65s ease forwards}
@keyframes greenLine{to{stroke-dashoffset:0}}
#greenWinBanner{position:absolute;top:7px;left:50%;transform:translate(-50%,-10px);z-index:14;padding:7px 13px;border:2px solid #fff0a5;border-radius:24px;background:linear-gradient(#fff0a5,#d69a2d 60%,#70420d);color:#251604;font:900 clamp(11px,3vw,16px) Montserrat,sans-serif;white-space:nowrap;opacity:0;pointer-events:none;box-shadow:0 5px 18px #000b}
#greenWinBanner.show{opacity:1;transform:translate(-50%,0);transition:.25s}
#machineFrame .reel-window{position:relative;z-index:2}
</style>
</head>
<body>

    <div class="top-bar">
        <div onclick="location.href='index.html'" style="cursor:pointer; font-size:1.5rem;">🏠</div>
        <div class="logo">THE GREEN</div>
        <div id="statusLight" style="width:12px; height:12px; background:var(--bright-green); border-radius:50%; box-shadow: 0 0 10px var(--bright-green);"></div>
    </div>

    <div class="stage">
        <div class="slot-machine" id="machineFrame">
            <div class="reel-window"><div class="reel-strip" id="r0"></div></div>
            <div class="reel-window"><div class="reel-strip" id="r1"></div></div>
            <div class="reel-window"><div class="reel-strip" id="r2"></div></div>
            <svg id="greenPayline" aria-hidden="true"></svg><div id="greenWinBanner">YOU WIN</div>
        </div>
    </div>

    <div class="dashboard">
        <div class="live-stats">
            <div class="stat-item">
                <span class="stat-label">Your Balance</span>
                <span class="stat-val gold" id="uiBal">0.00</span>
            </div>
            <div class="stat-item" style="border-left: 1px solid #333; border-right: 1px solid #333; padding: 0 15px;">
                <span class="stat-label">Current Bet</span>
                <span class="stat-val" id="uiBet">2.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Last Win</span>
                <span class="stat-val neon" id="uiWin">0.00</span>
            </div>
        </div>

        <div class="interaction-row">
            <div class="bet-stepper">
                <button class="btn-round" onclick="adjustBet(-2)">-</button>
                <div style="width: 60px; text-align: center; font-weight: 900; font-size: 1.2rem;" id="betMid">2</div>
                <button class="btn-round" onclick="adjustBet(2)">+</button>
            </div>

            <button class="spin-trigger" id="spinBtn" onclick="executeSpin()">SPIN</button>
        </div>
    </div>

<script src="asset/games/wallet.js"></script><script>
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycby5oeX598AtqVX_owDmR1yKiAQ6z0fjquHzf4YJccbyBqF1GwrGnRwyFt_pVvGyGl7j/exec";
    
    // Updated Assets
    const PAYTABLE = [
        { id: 'wild',  src: 'asset/wwild1.png',   x: 100 }, 
        { id: 'usd',   src: 'asset/usd.png',     x: 50 },
        { id: 'bell',  src: 'asset/bely1.png',   x: 30 },
        { id: 'coi',   src: 'asset/coi.png',     x: 20 },
        { id: 'gre',   src: 'asset/gre.png',     x: 15 },
        { id: 'straw', src: 'asset/strawberry.png', x: 10 },
        { id: 'lem',   src: 'asset/lemlem.png',   x: 5 },
        { id: 'otang', src: 'asset/otang.png',    x: 2 }
    ];

    let state = {
        user: JSON.parse(localStorage.getItem('rasta_user')) || { balance: 500, phone: '000' },
        bet: 2,
        spinning: false,
        walletReady: false
    };

    function init() {
        refreshUI();
        RastaWallet.sync().then(b=>{state.user.balance=b;state.walletReady=true;refreshUI()}).catch(e=>{document.getElementById('uiWin').innerText=e.message});
        // Pre-build reels
        for(let i=0; i<3; i++) {
            const strip = document.getElementById(`r${i}`);
            let content = '';
            for(let j=0; j<60; j++) {
                const item = PAYTABLE[Math.floor(Math.random() * PAYTABLE.length)];
                content += `<div class="symbol"><img src="${item.src}"></div>`;
            }
            strip.innerHTML = content;
        }
    }

    function adjustBet(amt) {
        if(state.spinning) return;
        state.bet = Math.max(2, state.bet + amt);
        refreshUI();
    }

    async function executeSpin() {
        if(state.spinning || !state.walletReady || state.user.balance < state.bet) {
            if(state.user.balance < state.bet) alert("Insufficient Balance");
            return;
        }
        state.spinning=true;
        const roundId='GREEN-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
        try{state.user.balance=await RastaWallet.debit(state.bet,roundId)}catch(e){state.spinning=false;document.getElementById('uiWin').innerText=e.message;return}
        state.currentRound=roundId;
        refreshUI();
        const btn=document.getElementById('spinBtn'),frame=document.getElementById('machineFrame');
        btn.disabled=true;
        frame.classList.remove('winner-reel');
        document.getElementById('uiWin').innerText='0.00';
        document.getElementById('greenPayline').innerHTML='';
        document.getElementById('greenWinBanner').classList.remove('show');
        const results=Array.from({length:3},()=>Math.floor(Math.random()*PAYTABLE.length));
        const animations=[];
        for(let i=0;i<3;i++){
            const strip=document.getElementById('r'+i),h=strip.children[0].getBoundingClientRect().height||90;
            const landingIndex=40+results[i],landing=strip.children[landingIndex];
            if(landing)landing.innerHTML='<img src="'+PAYTABLE[results[i]].src+'" alt="'+PAYTABLE[results[i]].id+'">';
            const stopY=-(landingIndex-1)*h,startY=stopY-18*h;
            strip.style.transition='none';
            strip.style.transform='translateY('+startY+'px)';
            void strip.offsetHeight;
            animations.push(new Promise(resolve=>setTimeout(()=>{
                const duration=1320+i*190;
                strip.style.transition='transform '+duration+'ms cubic-bezier(.10,.82,.12,1)';
                strip.style.transform='translateY('+stopY+'px)';
                setTimeout(resolve,duration+40);
            },i*130)));
        }
        await Promise.all(animations);
        await finalizeWin(results);
    }

    async function finalizeWin(indices) {
        const picked=indices.map(i=>PAYTABLE[i]);
        const wild=PAYTABLE.findIndex(s=>s.id==='wild');
        let base=picked.find(s=>s.id!=='wild'),count=0,win=0;
        if(picked.every(s=>s.id==='wild')){base=picked[0];count=3}
        else if(base&&picked.every(s=>s.id===base.id||s.id==='wild'))count=3;
        if(count===3)win=state.bet*(base.x||100);
        const line=document.getElementById('greenPayline'),frame=document.getElementById('machineFrame'),rect=line.getBoundingClientRect();
        line.innerHTML='';
        if(win>0){
            try{state.user.balance=await RastaWallet.credit(win,state.currentRound)}catch(e){localStorage.setItem('rasta_pending_game_payout',JSON.stringify({roundId:state.currentRound,amount:win}));document.getElementById('greenWinBanner').textContent='WIN · PAYOUT SYNC PENDING'}
            document.getElementById('uiWin').innerText=win.toFixed(2);
            document.getElementById('greenWinBanner').textContent='YOU WIN '+win.toLocaleString()+' CREDITS';
            document.getElementById('greenWinBanner').classList.add('show');
            const windows=[...frame.querySelectorAll('.reel-window')],pts=windows.map(el=>{const b=el.getBoundingClientRect();return (b.left+b.width/2-rect.left)+','+(b.top+b.height/2-rect.top)});
            line.setAttribute('viewBox','0 0 '+rect.width+' '+rect.height);
            const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',pts.join(' '));line.appendChild(p);
            frame.classList.add('winner-reel');

        }else{
            document.getElementById('uiWin').innerText='0.00';
            document.getElementById('greenWinBanner').classList.remove('show');
        }
        state.spinning=false;
        document.getElementById('spinBtn').disabled=false;
        refreshUI();
    }

    function refreshUI() {
        document.getElementById('uiBal').innerText = state.user.balance.toFixed(2);
        document.getElementById('uiBet').innerText = state.bet.toFixed(2);
        document.getElementById('betMid').innerText = state.bet;
        localStorage.setItem('rasta_user', JSON.stringify(state.user));
    }

    

    window.onload = init;
</script>
</body>
</html>
