<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RASTA GOLD SCRATCH</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD100; --green: #008542; --dark: #051a0c; --neon: #00ff66; }
        body { background: var(--dark); color: white; font-family: 'Goldman', sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        .header { padding: 15px; background: rgba(0,0,0,0.9); border-bottom: 3px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .bal-display { background: linear-gradient(to right, var(--green), #004d26); padding: 8px 18px; border-radius: 20px; border: 1px solid var(--gold); font-weight: bold; min-width: 100px; }
        
        /* NO ASSET NEEDED - CSS GENESIS SYMBOLS */
        .card-container { margin: 20px auto; width: 320px; height: 320px; position: relative; background: radial-gradient(circle, #1a3c1a, #051a0c); border-radius: 15px; border: 5px solid #333; box-shadow: 0 0 40px rgba(0,0,0,0.8); overflow: hidden; }
        .prize-grid { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); width: 100%; height: 100%; }
        .prize-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.05); }
        .sym-icon { font-size: 3rem; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
        .sym-mult { font-size: 0.7rem; color: var(--gold); margin-top: 5px; opacity: 0.8; }

        canvas { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; z-index:5; touch-action:none; }
        #msg { height: 35px; color: var(--gold); font-weight: bold; margin: 15px 0; text-transform: uppercase; font-size: 1.1rem; text-shadow: 0 0 10px rgba(255,209,0,0.4); }

        .controls { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.9); padding: 20px 0; border-top: 3px solid var(--gold); }
        .bet-bar { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .step-btn { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--gold); background: #222; color: var(--gold); font-size: 1.5rem; font-weight: bold; cursor: pointer; }
        .bet-info { background: #000; padding: 5px 25px; border-radius: 10px; border: 1px solid #444; }
        .bet-info small { display: block; font-size: 0.6rem; color: #888; }
        .bet-info b { font-size: 1.4rem; color: var(--gold); }
        .btn-buy { width: 80%; padding: 15px; background: linear-gradient(var(--green), #004d26); color: white; border: none; border-radius: 50px; font-weight: 900; font-size: 1.4rem; cursor: pointer; box-shadow: 0 5px 0 #002e17; }
        .btn-buy:disabled { filter: grayscale(1); opacity: 0.5; transform: none; box-shadow: none; }
    
/* Scratch card and controls fit smaller mobile screens */
html{min-height:100%;background:var(--dark)}
body{min-height:100dvh;height:auto;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;padding-bottom:185px}
.card-container{width:min(82vw,320px);height:min(82vw,320px);margin:16px auto}
#msg{margin:8px 0;height:auto;min-height:24px}
.controls{position:fixed;left:0;right:0;bottom:0;z-index:120;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));}
.bet-bar{gap:12px;margin-bottom:8px}
.step-btn{width:42px;height:42px}
.btn-buy{min-height:52px;padding:10px;font-size:1.15rem}

</style>
</head>
<body>

<div class="header">
    <div onclick="location.href='index.html'" style="cursor:pointer; font-size: 1.5rem;">✕</div>
    <div class="bal-display" id="balDisplay">0.00</div>
    <div id="status" style="font-size: 0.7rem; color: var(--neon);">CONNECTED</div>
</div>

<div class="card-container">
    <div class="prize-grid" id="grid">
        <div class="prize-cell"><div class="sym-icon">🦁</div><div class="sym-mult">x50</div></div>
        <div class="prize-cell"><div class="sym-icon">💎</div><div class="sym-mult">x20</div></div>
        <div class="prize-cell"><div class="sym-icon">💰</div><div class="sym-mult">x10</div></div>
        <div class="prize-cell"><div class="sym-icon">🍀</div><div class="sym-mult">x5</div></div>
    </div>
    <canvas id="cvs" width="320" height="320"></canvas>
</div>

<div id="msg">BUY TICKET TO START</div>

<div class="controls">
    <div class="bet-bar">
        <button class="step-btn" onclick="adj(-5)">-</button>
        <div class="bet-info"><small>COST</small><b id="bet">5</b></div>
        <button class="step-btn" onclick="adj(5)">+</button>
    </div>
    <button class="btn-buy" onclick="buy()" id="buyBtn">BUY TICKET</button>
</div>

<script>
    const SCRIPT = "https://script.google.com/macros/s/AKfycby5oeX598AtqVX_owDmR1yKiAQ6z0fjquHzf4YJccbyBqF1GwrGnRwyFt_pVvGyGl7j/exec";
    let user = JSON.parse(localStorage.getItem('rasta_user')||'null');
    let bet=5, active=false, finished=false, scratchPixels=0;
    const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d',{willReadFrequently:true});
    const icons=[{i:'LION',m:50},{i:'DIAMOND',m:20},{i:'GOLD',m:10},{i:'CLOVER',m:5}];
    function fitCanvas(){const box=cvs.parentElement.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);cvs.width=Math.round(box.width*dpr);cvs.height=Math.round(box.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cover();}
    function init(){if(!user)return location.href='index.html';user.balance=Number(user.balance)||0;fitCanvas();syncUI();window.addEventListener('resize',()=>{if(!active)fitCanvas()});}
    function cover(){const w=cvs.width/(Math.min(devicePixelRatio||1,2)),h=cvs.height/(Math.min(devicePixelRatio||1,2));ctx.globalCompositeOperation='source-over';const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#704000');g.addColorStop(.45,'#ffd65b');g.addColorStop(1,'#9a5a08');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#fff0a6';ctx.lineWidth=3;for(let y=14;y<h;y+=22){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y-8);ctx.stroke()}ctx.fillStyle='#321900';ctx.font='900 19px sans-serif';ctx.textAlign='center';ctx.fillText('RASTA GOLD',w/2,h/2+7);}
    function syncUI(){document.getElementById('balDisplay').textContent=user.balance.toFixed(2);document.getElementById('bet').textContent=bet;localStorage.setItem('rasta_user',JSON.stringify(user));}
    function adj(v){if(!active){bet=Math.max(5,Math.min(500,bet+v));syncUI();}}
    function buy(){if(active)return;if(finished){finished=false;document.getElementById('buyBtn').textContent='BUY TICKET';document.getElementById('msg').textContent='BUY TICKET TO START';cover();return;}if(user.balance<bet){document.getElementById('msg').textContent='INSUFFICIENT BALANCE';return;}user.balance-=bet;sync();active=true;document.getElementById('buyBtn').disabled=true;document.getElementById('msg').textContent='SCRATCH THE GOLD';const results=Array.from({length:4},()=>icons[Math.floor(Math.random()*icons.length)]);document.getElementById('grid').innerHTML=results.map(r=>'<div class="prize-cell"><div class="sym-icon" style="font-size:clamp(1.25rem,7vw,2.6rem);font-weight:900;color:#ffe28a;text-shadow:0 3px 8px #000">'+r.i+'</div><div class="sym-mult">x'+r.m+'</div></div>').join('');const counts={};results.forEach(r=>counts[r.i]=(counts[r.i]||0)+1);cvs.win=results.reduce((best,r)=>counts[r.i]>=3?Math.max(best,bet*r.m):best,0);scratchPixels=0;cvs.style.opacity='1';cover();}
    function scratch(e){if(!active)return;const rect=cvs.getBoundingClientRect(),dpr=cvs.width/rect.width,x=e.clientX-rect.left,y=e.clientY-rect.top;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,Math.max(18,rect.width*.075),0,Math.PI*2);ctx.fill();scratchPixels+=Math.PI*Math.pow(Math.max(18,rect.width*.075),2);if(scratchPixels/(rect.width*rect.height)>.5)finish();}
    function finish(){if(!active)return;active=false;ctx.globalCompositeOperation='source-over';if(cvs.win>0){user.balance+=cvs.win;document.getElementById('msg').textContent='YOU WON '+cvs.win.toFixed(2)+' ETB';}else document.getElementById('msg').textContent='NO WIN THIS TIME';sync();finished=true;document.getElementById('buyBtn').disabled=false;document.getElementById('buyBtn').textContent='NEW TICKET';}
    function sync(){syncUI();fetch(SCRIPT+'?action=updateBalance&phone='+encodeURIComponent(user.phone||'')+'&balance='+encodeURIComponent(user.balance)).catch(()=>{});}
    cvs.addEventListener('pointerdown',e=>{if(active){cvs.setPointerCapture(e.pointerId);scratch(e)}});cvs.addEventListener('pointermove',e=>{if(active&&e.buttons)scratch(e)});
    window.onload=init;</script>
</body>
</html>
